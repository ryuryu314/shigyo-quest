<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>士業クエスト — 自動チェック</title>
<style>body{font:14px/1.6 "BIZ UDPGothic","Yu Gothic UI",system-ui,sans-serif;margin:20px;color:#22243a}h1{font-size:20px}pre{white-space:pre-wrap;background:#f7f6fb;border:1px solid #e8e6f1;border-radius:10px;padding:12px}.ok{color:#17825e}.ng{color:#c0392b;font-weight:700}</style>
</head>
<body>
<h1>士業ドパミンクエスト — 自動チェック</h1>
<p id="sum">実行中…</p>
<pre id="out"></pre>
<script src="../js/core.js"></script>
<script src="../data/exams.js"></script>
<script src="../data/q-yobi.js"></script>
<script src="../data/q-cpa.js"></script>
<script src="../data/q-shoshi.js"></script>
<script src="../data/q-benri.js"></script>
<script src="../data/easy.js"></script>
<script src="../js/store.js"></script>
<script src="../js/engine.js"></script>
<script>
(function () {
  'use strict';
  const out = [], fails = [];
  const log = s => out.push(s);
  const check = (cond, msg) => { if (cond) log('  ok  ' + msg); else { log('  NG  ' + msg); fails.push(msg); } };

  // 記録はテスト用に分ける（本物の記録を汚さない）
  SQ.store.reset();

  /* 1. データ検証 */
  const errs = SQ.validate();
  log('■ データ検証：' + SQ.Q.length + '問');
  errs.forEach(e => log('  NG  ' + e));
  check(errs.length === 0, 'データの問題がない');

  /* 2. 正解を選ぶ・外す関数 */
  function solve(it, good) {
    const q = it.q;
    if (q.sec === 'kyoyo') it.sel = true; // 一般教養は選択欄にもマークする
    if (q.kind === 'mcq') {
      if (q.form === 'tf') it.ans = q.st.map(s => good ? s[2] : !s[2]);
      else { const k = SQ.mcqKey(q); it.ans = good ? k.answer : (k.answer + 1) % k.choices.length; }
      it.score = SQ.judgeMcq(q, it.ans).score;
    } else if (q.kind === 'case') {
      q.steps.forEach((s, i) => {
        const right = s.options.map((o, k) => o[1] ? k : -1).filter(k => k >= 0);
        const wrong = s.options.map((o, k) => o[1] ? -1 : k).filter(k => k >= 0);
        it.stepAns[i] = s.type === 'multi' ? (good ? right : wrong) : (good ? right[0] : wrong[0]);
        it.stepScore[i] = SQ.judgeStep(s, it.stepAns[i]).score;
      });
      it.score = SQ.caseScore(q, it.stepScore);
    } else {
      it.turnScore = q.turns.map(() => good ? 1 : 0);
      it.score = SQ.oralScore(q, it.turnScore);
    }
    it.done = true;
  }

  /* 3. 各段階：全問正解なら合格、全問不正解なら不合格 */
  log('\n■ 段階ごとの判定');
  SQ.EXAMS.forEach(e => e.stages.forEach(s => {
    const good = SQ.newRun({ exam: e.id, stage: s.id, mode: 'practice' });
    good.items.forEach(it => solve(it, true));
    const rg = SQ.evalRun(good);
    check(rg.pass === true && Math.abs(rg.ratio - 1) < 1e-9, e.short + ' ' + s.name + '：全問正解で合格（' + SQ.round1(rg.score) + ' / ' + rg.of + '、' + good.items.length + '問）');
    const bad = SQ.newRun({ exam: e.id, stage: s.id, mode: 'practice' });
    bad.items.forEach(it => solve(it, false));
    const rb = SQ.evalRun(bad);
    check(rb.pass === false && rb.ratio < 0.01, e.short + ' ' + s.name + '：全問不正解で不合格（得点率 ' + Math.round(rb.ratio * 100) + '%）');
  }));

  /* 4. 足切り・基準点 */
  log('\n■ 足切り・基準点');
  (function () {
    const r = SQ.newRun({ exam: 'cpa', stage: 'tanto', mode: 'practice' });
    r.items.forEach(it => solve(it, it.q.sec !== 'kigyo'));
    const res = SQ.evalRun(r);
    check(res.ratio >= 0.7 && res.pass === false, '会計士 短答：企業法0点なら合計80%でも不合格（' + Math.round(res.ratio * 100) + '%）');
  })();
  (function () {
    const r = SQ.newRun({ exam: 'shoshi', stage: 'hikki', mode: 'practice' });
    r.items.forEach(it => solve(it, it.q.sec !== 'kijutsu'));
    const res = SQ.evalRun(r);
    check(res.pass === false, '司法書士 筆記：記述0点なら不合格（合計 ' + SQ.round1(res.score) + '）');
  })();
  (function () {
    const r = SQ.newRun({ exam: 'benri', stage: 'koujutsu', mode: 'practice' });
    r.items.forEach(it => solve(it, it.q.sec === 'tokkyo'));
    const res = SQ.evalRun(r);
    check(res.pass === false && res.abc === 'A C C', '弁理士 口述：C評価2科目で不合格（' + res.abc + '）');
    const r2 = SQ.newRun({ exam: 'benri', stage: 'koujutsu', mode: 'practice' });
    r2.items.forEach(it => solve(it, it.q.sec !== 'shohyo'));
    const res2 = SQ.evalRun(r2);
    check(res2.pass === true && res2.abc === 'A A C', '弁理士 口述：C評価1科目なら合格（' + res2.abc + '）');
  })();
  (function () {
    const r = SQ.newRun({ exam: 'yobi', stage: 'koujutsu', mode: 'practice' });
    r.items.forEach(it => { solve(it, true); if (it.q.sec === 'keiji') { it.turnScore = [1, 0, 0]; it.score = SQ.oralScore(it.q, it.turnScore); } });
    const res = SQ.evalRun(r);
    check(res.pass === true && res.score === 63 + 59, '予備 口述：民事満点＋刑事1/3で 63＋59＝122 合格（' + res.score + '）');
  })();
  (function () {
    const r = SQ.newRun({ exam: 'yobi', stage: 'tanto', mode: 'practice' });
    const tf = r.items.find(it => it.q.form === 'tf');
    tf.ans = tf.q.st.map((s, i) => i === 0 ? !s[2] : s[2]);
    check(Math.abs(SQ.judgeMcq(tf.q, tf.ans).score - 1 / 3) < 1e-9, '各肢の正誤：1つ違いは3分の1');
  })();

  /* 5. 本試験ロードと免除 */
  log('\n■ 本試験ロードと免除');
  const P = { pass: true, score: 1, of: 1 }, F = { pass: false, score: 0, of: 1 };
  const st = id => SQ.exam(id).stages[SQ.road(id).stage].id;
  check(SQ.roadApply('cpa', 'tanto', P) === 'next' && st('cpa') === 'ronbun', '会計士：短答合格 → 論文へ');
  SQ.roadApply('cpa', 'ronbun', F);
  check(SQ.road('cpa').year === 2 && st('cpa') === 'ronbun', '会計士：論文不合格 → 2年目は短答免除で論文から');
  SQ.roadApply('cpa', 'ronbun', F);
  check(st('cpa') === 'ronbun', '会計士：3年目も短答免除');
  SQ.roadApply('cpa', 'ronbun', F);
  check(st('cpa') === 'tanto', '会計士：4年目は短答から（免除は2年）');
  check(SQ.roadApply('cpa', 'tanto', P) === 'next' && SQ.roadApply('cpa', 'ronbun', P) === 'final' && SQ.road('cpa').wins === 1, '会計士：最終合格で合格証');

  SQ.roadApply('benri', 'tanto', P); SQ.roadApply('benri', 'ronbun', P); SQ.roadApply('benri', 'koujutsu', F);
  check(st('benri') === 'koujutsu', '弁理士：口述不合格 → 翌年は短答・論文免除で口述から');
  SQ.roadApply('benri', 'koujutsu', F); SQ.roadApply('benri', 'koujutsu', F);
  check(st('benri') === 'tanto', '弁理士：免除2年が切れたら短答から');

  SQ.roadApply('yobi', 'tanto', P); SQ.roadApply('yobi', 'ronbun', F);
  check(st('yobi') === 'tanto' && SQ.road('yobi').year === 2, '予備試験：論文不合格 → 翌年は短答から（免除なし）');

  SQ.roadApply('shoshi', 'hikki', P); SQ.roadApply('shoshi', 'koujutsu', F);
  check(st('shoshi') === 'koujutsu', '司法書士：口述不合格 → 次回は筆記免除');
  SQ.roadApply('shoshi', 'koujutsu', F);
  check(st('shoshi') === 'hikki', '司法書士：筆記免除は次回だけ');

  /* 6. 中断と再開 */
  log('\n■ 中断と再開');
  (function () {
    const r = SQ.newRun({ exam: 'shoshi', stage: 'hikki', mode: 'road' });
    solve(r.items[0], true); solve(r.items[1], false);
    r.items[2].ans = 1; r.items[3].flag = true; r.items[4].revealed = true;
    const kase = r.items.find(it => it.q.kind === 'case');
    kase.step = 2; kase.stepAns = [0, 0]; kase.stepScore = [1, 0];
    r.idx = 5; r.elapsed = 123.4; r.combo = 2; r.get = 7.5; r.peeked = 1; r.interrupted = true;
    r.opened = [true, false]; r.pElapsed = [61.5, 0]; r.curP = 0;
    const saved = JSON.parse(JSON.stringify(SQ.saveRun(r)));
    const back = SQ.loadRun(saved);
    check(!!back && back.items.length === r.items.length, '保存した挑戦を読み戻せる');
    check(back.idx === 5 && back.elapsed === 123.4 && back.combo === 2 && back.get === 7.5 && back.peeked === 1, '位置・時間・コンボ・GET・解答を見た数が戻る');
    check(back.items[0].done && back.items[0].score === 1 && back.items[1].score === 0 && back.items[2].ans === 1 && back.items[3].flag && back.items[4].revealed, '各問の解答・正誤・見直し・解答を見た印が戻る');
    const bk = back.items.find(it => it.q.kind === 'case');
    check(bk.step === 2 && bk.stepScore[0] === 1 && bk.stepAns[1] === 0, '論文・記述のとちゅうの段落が戻る');
    check(back.mode === 'road' && back.stage === 'hikki' && Math.abs(back.items[0].max - r.items[0].max) < 1e-9, 'モード・段階・配点が戻る');
    check(back.opened[0] === true && back.opened[1] === false && back.pElapsed[0] === 61.5 && back.curP === 0, '時限の表紙・時限ごとの時間・今の時限が戻る');
    const broken = JSON.parse(JSON.stringify(saved)); broken.ids[0] = 'no-such-id';
    check(SQ.loadRun(broken) === null, '問題が消えた中断データは読み込まない');
  })();

  /* 6b. 本番の形式（時限・問題番号・解答欄・配点・一般教養の選択） */
  log('\n■ 本番の形式');
  (function () {
    const y = SQ.newRun({ exam: 'yobi', stage: 'tanto', mode: 'road' });
    check(y.periods.map(p => p.id).join(',') === 'minji,kenko,keiji,kyoyo', '予備 短答：時限は 民法・商法・民訴 → 憲法・行政法 → 刑法・刑訴 → 一般教養（' + y.periods.map(p => p.name).join(' → ') + '）');
    check(y.opened.every(v => v === false) && SQ.newRun({ exam: 'yobi', stage: 'tanto', mode: 'practice' }).opened.every(v => v === true), '本試験モードは時限ごとに表紙から、練習モードは表紙なし');
    const first = y.items[0];
    check(first.q.sec === 'minpo' && first.no === 1 && first.boxes.join() === '1' && first.pts === 2, '予備：最初は民法〔第1問〕（配点：2）解答欄［No.1］');
    const k1 = y.items.find(it => it.id === 'yobi-kenpo-01'), k2 = y.items.find(it => it.id === 'yobi-kenpo-02');
    check(k1.no === 1 && k1.boxes.join() === '1,2,3' && k1.pts === 3, '予備：憲法・行政法の冊子は〔第1問〕から。各記述の正誤（3記述）は［No.1］〜［No.3］で配点3（' + k1.boxes.join(',') + '）');
    check(k2.no === 2 && k2.boxes.join() === '4' && k2.pts === 2, '予備：続く○×の組合せは〔第2問〕［No.4］配点2');
    const key2 = SQ.mcqKey(k2.q);
    check(key2.choices.length === 8 && key2.answer === 4 && key2.choices[4].text === 'ア× イ○ ウ○', '○×の組合せは1〜8の本番の並び（正解 5：' + key2.choices[key2.answer].text + '）');
    const ky = y.items.filter(it => it.q.sec === 'kyoyo');
    check(ky.length >= 5 && y.select.kyoyo === Math.max(1, Math.round(ky.length * 20 / 44)) && ky.every(it => it.pts === 3), '一般教養：' + ky.length + '題から' + y.select.kyoyo + '題を選択（本番44題中20題の比率）・1問3点');
    ky.forEach(it => { it.done = true; it.score = 1; it.ans = 0; });
    ky[0].sel = false; ky[1].sel = true; ky[2].sel = true; ky[3].sel = true; ky[4].sel = false;
    ky[2].score = 0;
    const set = SQ.countedSet(y, 'kyoyo');
    check(set.size === 2 && set.has(ky[1]) && set.has(ky[2]) && !set.has(ky[3]), '一般教養：指定数を超えて選ぶと、問題番号の小さい方から採点（選択3題 → 第' + ky[1].no + '問・第' + ky[2].no + '問）');
    const ry = SQ.evalRun(y), sk = ry.secs.find(s => s.sec.id === 'kyoyo');
    check(Math.abs(sk.ratio - 0.5) < 1e-9 && Math.abs(sk.show - 30) < 1e-9, '一般教養：採点した2題のうち1題正解で 30 / 60（' + SQ.round1(sk.show) + '）');

    const c = SQ.newRun({ exam: 'cpa', stage: 'tanto', mode: 'road' });
    check(c.periods.map(p => p.id).join(',') === 'kigyo,kanri,kansa,zaimu', '会計士 短答：企業法 → 管理会計論 → 監査論 → 財務会計論');
    const z = c.items.filter(it => it.q.sec === 'zaimu');
    check(z[0].q.form !== 'pick' && z.every((it, i) => it.no === i + 1) && z.every(it => it.pts === 6), '会計士：財務会計論は理論問題が先、問題1から、各6点');
    const kg = c.items.filter(it => it.q.sec === 'kigyo'), km = c.items.filter(it => it.q.sec === 'kanri');
    check(kg.every(it => it.pts === 5) && km.every(it => it.pts === (it.q.form === 'pick' ? 6 : 5)), '会計士：企業法は各5点、管理会計論は理論5点・計算6点');
    check(SQ.mcqKey(kg[0].q).choices.length === 6, '会計士：選択肢は1〜6');

    const s = SQ.newRun({ exam: 'shoshi', stage: 'hikki', mode: 'road' });
    const gogo = s.items.filter(it => it.pno === 1);
    const tak = gogo.filter(it => it.q.kind === 'mcq'), kij = gogo.filter(it => it.q.kind === 'case');
    check(s.periods.map(p => p.name).join() === '午前の部,午後の部' && tak.every((it, i) => it.no === i + 1) && kij.map(it => it.no).join() === '36,37', '司法書士：午後の部は択一が第1問から、記述式は第36問・第37問');
    check(s.items.filter(it => it.q.kind === 'mcq').every(it => it.pts === 3) && kij.every(it => it.pts === 70), '司法書士：択一1問3点・記述式1問70点');

    const b = SQ.newRun({ exam: 'benri', stage: 'tanto', mode: 'road' });
    const bi = b.items.filter(it => it.q.sec === 'isho'), bt = b.items.filter(it => it.q.sec === 'tokkyo');
    check(bt.map(it => it.no).join() === bt.map((x, i) => i + 1).join() && bi[0].no === 1 && b.items.every(it => it.pts === 1), '弁理士：科目ごとに【特許・実用新案】1・【意匠】1…と番号を振り、1題1点');

    const r = SQ.newRun({ exam: 'yobi', stage: 'tanto', mode: 'practice' });
    r.items.forEach(it => solve(it, true));
    const res = SQ.evalRun(r);
    const expMax = r.items.filter(it => it.q.sec !== 'kyoyo').reduce((a, it) => a + it.pts, 0) + r.select.kyoyo * 3;
    check(Math.abs(res.rawMax - expMax) < 1e-9 && Math.abs(res.rawGot - expMax) < 1e-9, '素点：収録問題の本番どおりの点数で ' + res.rawGot + ' / ' + res.rawMax);
  })();

  /* 7. レベル */
  log('\n■ レベル');
  check(SQ.levelOf(0).lv === 1 && SQ.levelOf(59).lv === 1 && SQ.levelOf(60).lv === 2 && SQ.levelOf(150).lv === 3, 'レベルの境目（60・150）');

  /* 8. 正解一覧（目視確認用） */
  log('\n■ 択一の正解一覧');
  SQ.Q.filter(q => q.kind === 'mcq').forEach(q => {
    const k = SQ.mcqKey(q);
    const ans = q.form === 'tf' ? q.st.map(s => s[0] + (s[2] ? '1' : '2')).join(' ') : (k.answer + 1) + '（' + k.choices[k.answer].text.slice(0, 24) + '）';
    log('  ' + q.id.padEnd(20) + ' ' + q.form.padEnd(6) + ' ' + ans);
  });

  SQ.store.reset();
  try { localStorage.removeItem('shigyo-quest-v1'); } catch (e) { /* noop */ }
  document.getElementById('out').textContent = out.join('\n');
  const sum = document.getElementById('sum');
  sum.className = fails.length ? 'ng' : 'ok';
  sum.textContent = fails.length ? 'NG ' + fails.length + '件：' + fails.join(' / ') : 'すべてOK（' + out.filter(s => s.startsWith('  ok')).length + '項目）';
  document.title = (fails.length ? 'NG ' : 'OK ') + document.title;
})();
</script>
</body>
</html>
